name: InAppStory

packages:
  - .
scripts:
  generate pigeons:
    description: Generate pigeons 🕊
    hooks:
      pre: echo `Generating all pigeons 🕊️`
      post: echo `Pigeons generated 🕊`
    steps:
      - flutter pub get
      - dart run pigeon --input pigeons/pigeon_generation.dart
      - dart run pigeon --input pigeons/pigeon_generation_private.dart
      - dart run pigeon --input pigeons/banner_place_generation.dart
      - dart run pigeon --input pigeons/checkout_generation.dart

  run pod install:
    description: Running pod install in examples
    steps:
      - cd example/ios
      - pod install --repo-update
      - cd ../../example_extended
      - pod install --repo-update
      - cd ../

  test publish:
    description: 🧩 Test build before publish 🧩
    steps:
      - flutter clean
      - flutter pub get
      - cd example/ios
      - rm Podfile.lock
      - pod install --repo-update
      - cd ../
      - flutter build apk

  publish plugin:
    description: 🚀 Publishing plugin  🚀
    steps:
      - flutter pub get
      - dart pub publish

  test:
    description: 🧪 Run all unit tests
    exec: flutter test

  test:android:
    description: 🤖 Run Android native unit tests via Gradle
    steps:
      - cd example/android && ./gradlew :inappstory_plugin:testDebugUnitTest

  test:ios:
    description: 🍏 Run iOS native unit tests via xcodebuild
    steps:
      - xcodebuild test -workspace example/ios/Runner.xcworkspace -scheme Runner -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -only-testing:RunnerTests

  test:all:
    description: 🚀 Run all tests (Flutter + Android unit tests)
    steps:
      - melos run test
      - melos run test:android

  coverage:
    description: 📊 Run flutter test with coverage and verify line coverage threshold
    exec: ./scripts/coverage_check.sh

  quality-report:
    description: 📋 Generate test density and coverage quality report
    exec: ./scripts/quality_report.sh

  mutation-test:
    description: 🔬 Run mutation testing on business logic classes
    exec: ./scripts/mutation_test.sh